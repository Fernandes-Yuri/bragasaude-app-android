name: Validar modelos de voz
on:
  push:
    branches: ['feat/**', 'fix/**', master]
    paths:
      - 'app/src/main/java/br/com/bragasaude/data/local/voice/**'
      - '.github/scripts/check_voice_models.py'
      - '.github/workflows/voice-models.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sintetizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install sherpa-onnx==1.13.8
      - run: python .github/scripts/check_voice_models.py
