name: Validar exclusão Firebase
on:
  push:
    branches: ['master', 'fix/**']
    paths: ['functions-deletion/**', 'firebase.json', '.github/workflows/account-deletion.yml']
  pull_request:
    branches: [master]
    paths: ['functions-deletion/**', 'firebase.json', '.github/workflows/account-deletion.yml']
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions-deletion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions-deletion/package-lock.json
      - run: npm ci
      - run: node --check index.js && node --check worker.js
      - run: npm test
      - run: GCLOUD_PROJECT=braga-saude node -e 'const f = require("./index"); if (!f.onUserDeleted || !f.retryAccountDeletions) process.exit(1)'
