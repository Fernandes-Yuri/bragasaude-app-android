# =============================================================================
# Braga Saúde — Compilação do APK na nuvem (GitHub Actions)
# Ver documentação completa em:
#   Contexto/08_RELEASE_E_DISTRIBUICAO/03_CI_GITHUB_ACTIONS_BUILD_NA_NUVEM.md
#
# Duas "pistas" a partir de um único workflow (disparo manual):
#   1. build-teste       -> só compila + salva artifact (NÃO é release)
#   2. lancar-release    -> publica GitHub Release (e pronto p/ gateway)
#
# O APK de teste desce no seu PC com GitHub CLI:
#   gh run download <run-id> -n braga-release-apk
# e instala no celular com:
#   adb install -r app-release.apk        (USB ou adb tcpip 5555)
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64     .jks em base64 (uma linha)
#   KEYSTORE_STORE_PASSWORD     senha do keystore
#   KEYSTORE_KEY_ALIAS          alias da chave  (padrão: bragasaude_key)
#   KEYSTORE_KEY_PASSWORD       senha da chave
# Segredo opcional (libera a entrega no gateway — seção 8 do doc 03):
#   GATEWAY_SSH_KEY             chave deploy-braga-ec2 (já existe na pasta de credenciais)
# =============================================================================

name: Build APK

on:
  # Toda vez que chega código novo no master: só build de teste (nunca release).
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'releases/**'
  # Disparo manual com escolha do destino.
  workflow_dispatch:
    inputs:
      destino:
        description: "O que fazer com o APK depois de compilar?"
        type: choice
        default: build-teste
        options:
          - build-teste
          - lancar-release
      variante:
        description: "Variante do APK (debug desativa bloqueio de dev para testes)"
        type: choice
        default: debug
        options:
          - debug
          - release
      run_id_testada:
        description: "(só para lancar-release) ID da run testada, para promover o MESMO APK. Deixe vazio para usar a run atual."
        required: false
        default: ''

# O release cria tag/GitHub Release (contents:write) e a pista de promoção
# baixa artifact de outra run (actions:read).
permissions:
  contents: write
  actions: read

# Evita duas builds iguais correndo em paralelo (desperdício de minutos).
concurrency:
  group: build-apk-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — BUILD: sempre roda. Compila o APK de release assinado e salva
  # como artifact (descartável, não é release, some em 30 dias).
  # ---------------------------------------------------------------------------
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21 = JVM mínima do AGP 9. O Gradle pode precisar do JDK 25
      # (pinado em gradle/gradle-daemon-jvm.properties); se precisar, ele
      # acha nas instalações da runner via org.gradle.java.installations.paths.
      - name: JDK 21 e 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Plataforma de compilação (compileSdk 35)
        run: yes | sdkmanager --install "platforms;android-35"

      # Wrapper unix (./gradlew) NÃO está no repositório — só gradlew.bat.
      # A action oficial provê o Gradle 9.5.0 (mesma versão do wrapper).
      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # Keystore e senhas saem dos secrets e viram arquivos locais do runner.
      # NUNCA vão para o git (estão no .gitignore: *.jks e keystore.properties).
      # Se os secrets ainda não foram cadastrados, a build segue SEM assinatura
      # (app/build.gradle.kts trata o caso) — a primeira run serve de prova.
      - name: Materializar keystore de release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "⚠️ Secret RELEASE_KEYSTORE_BASE64 vazio — APK sai SEM assinatura."
            echo "   Cadastre os 4 secrets da keystore (ver doc 03) para assinar."
            exit 0
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_ALIAS" "$KEYSTORE_KEY_PASSWORD" \
            > keystore.properties
          echo "✅ Keystore materializada ($(wc -c < release-keystore.jks) bytes)"

      # --no-daemon evita o download do JDK 25 pinado em
      # gradle/gradle-daemon-jvm.properties; installations.paths dá o caminho
      # das JDKs instaladas pela setup-java caso a criteria seja aplicada.
      - name: Compilar APK
        id: apk
        env:
          INPUT_VARIANTE: ${{ inputs.variante }}
        run: |
          JDK_PATHS=$(ls -d "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/Java_Temurin_jdk"/*/x64 2>/dev/null | paste -sd, -)
          echo "JDKs visíveis ao Gradle: $JDK_PATHS"
          if [ "$INPUT_VARIANTE" = "debug" ] || [ "$GITHUB_REF_NAME" = "codex/debug-sem-bloqueio-dev" ]; then
            gradle assembleDebug --no-daemon --stacktrace \
              -Dorg.gradle.java.installations.paths="$JDK_PATHS"
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=braga-debug-apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug (bloqueio de modo desenvolvedor desativado)" >> "$GITHUB_OUTPUT"
            echo "retention=7" >> "$GITHUB_OUTPUT"
          else
            gradle assembleRelease --no-daemon --stacktrace \
              -Dorg.gradle.java.installations.paths="$JDK_PATHS"
            # Se gerou unsigned, padroniza o nome para upload sem quebra.
            if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
              UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
              if [ -n "$UNSIGNED_APK" ]; then
                cp "$UNSIGNED_APK" app/build/outputs/apk/release/app-release.apk
                echo "ℹ️ APK não-assinado padronizado para app-release.apk"
              fi
            fi
            echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=braga-release-apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "retention=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Salvar APK como artifact (descartável)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: ${{ steps.apk.outputs.retention }}
          if-no-files-found: error

      - name: Resumo da build
        run: |
          {
            echo "### :white_check_mark: APK compilado na nuvem"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Destino | \`${{ github.event.inputs.destino || 'build-teste (push)' }}\` |"
            echo "| Variante | \`${{ steps.apk.outputs.variant }}\` |"
            echo "| Artifact | \`${{ steps.apk.outputs.artifact }}\` |"
            echo
            echo "> :bulb: Baixe no PC: \`gh run download ${GITHUB_RUN_ID} -n ${{ steps.apk.outputs.artifact }}\`"
            echo "> :iphone: Instale no celular: \`adb install -r $(basename ${{ steps.apk.outputs.path }})\`"
            echo "> :warning: Artifact NÃO é release — nada foi publicado."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # JOB 2 — TESTES UNITÁRIOS: roda em paralelo. Se quebra, NÃO bloqueia o
  # artifact (job independente). É o relatório de saúde do código.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 e 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Plataforma de compilação (compileSdk 35)
        run: yes | sdkmanager --install "platforms;android-35"

      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # AUD-AN02 — gate anti-regressão de emojis em strings de UI.
      # O item quitou e REGREDIU 2x (limpeza por commit seguida de reinserção).
      # Agora quebra o CI se alguém voltar a colocar emoji numa string de UI.
      # Python puro, sem dependências — vem com o ubuntu-latest.
      - name: Gate AUD-AN02 (emojis em strings de UI)
        run: python3 tools/check_emojis_ui.py

      - name: Rodar testes unitários
        run: |
          JDK_PATHS=$(ls -d "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/Java_Temurin_jdk"/*/x64 2>/dev/null | paste -sd, -)
          gradle testDebugUnitTest --no-daemon \
            -Dorg.gradle.java.installations.paths="$JDK_PATHS"

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-unitarios
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Publicar schemas Room gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ github.sha }}
          path: app/schemas/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # JOB 3 — RELEASE: só roda se você escolher "lancar-release".
  # PRINCÍPIO CHAVE: promove o APK que você JÁ TESTOU (mesmos bytes), não
  # recompila. Se veio de outra run, passe o run_id_testada.
  # ---------------------------------------------------------------------------
  release:
    name: Publicar GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.destino == 'lancar-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do app
        id: versao
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts | head -n 1)"   >> "$GITHUB_OUTPUT"

      # run_id_testada vazio = promove a build desta própria run.
      - name: Baixar APK (da run testada ou da atual)
        uses: actions/download-artifact@v4
        with:
          name: braga-release-apk
          run-id: ${{ inputs.run_id_testada || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar GitHub Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.name }}-build${{ steps.versao.outputs.code }}
          name: BragaSaude v${{ steps.versao.outputs.name }} (build ${{ steps.versao.outputs.code }})
          files: app-release.apk
          generate_release_notes: true
          prerelease: false
          body: |
            ## 📦 Release oficial — BragaSaude v${{ steps.versao.outputs.name }}

            APK assinado, compilado no GitHub Actions (run #${{ github.run_id }}).

            > ⚠️ Assinatura nova (D46): usuários da v1.1.2 precisam **desinstalar e reinstalar**.
            > Comunique o backup dos dados locais antes (LGPD).

      # Entrega no gateway (libera o download em https://api.bragasaude.online).
      #
      # host DEVE ser o DNS publico direto da EC2, NAO api.bragasaude.online:
      # este dominio passa pelo Cloudflare Tunnel, que so faz proxy de 80/443.
      # A porta 22 (SSH) nao chega na instancia por ele (doc 02, linha 177).
      #
      # Segredo GATEWAY_SSH_KEY: chave privada deploy-braga-ec2 (mesma do
      # deploy.yml do gateway-api). Cadastro uma unica vez (doc 03, secao 8).
      - name: Publicar APK no gateway (EC2)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.GATEWAY_SSH_KEY }}
          source: app-release.apk
          target: /home/ec2-user/braga-gateway/releases/

      - name: Promover release no gateway (disco + RDS)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_URL: ${{ secrets.RDS_DATABASE_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.GATEWAY_SSH_KEY }}
          envs: DB_URL
          script: |
            set -e
            cd /home/ec2-user/braga-gateway
            # DATABASE_URL chega pela env DB_URL (secret RDS_DATABASE_URL),
            # nao do .env: ler .env por SSH executa senhas sem aspas como
            # comando (linha 6 do .env, senha de app do Gmail).
            export DATABASE_URL="$DB_URL"
            if [ -z "$DATABASE_URL" ]; then
              echo "ERRO: DATABASE_URL ausente (secret RDS_DATABASE_URL)" >&2
              exit 1
            fi
            V='${{ steps.versao.outputs.name }}'
            C='${{ steps.versao.outputs.code }}'
            REL_DIR="/home/ec2-user/braga-gateway/releases"
            SRC="$REL_DIR/app-release.apk"
            VERSIONED="$REL_DIR/BragaSaude-v$V-build$C-release.apk"
            SERVED="$REL_DIR/BragaSaude.apk"
            cp -f "$SRC" "$VERSIONED"
            cp -f "$SRC" "$SERVED"
            SHA=$(sha256sum "$VERSIONED" | awk '{print toupper($1)}')
            SIZE=$(stat -c%s "$VERSIONED")
            echo "Release v$V-build$C: $SIZE bytes, sha256=$SHA"
            if [ -z "$DATABASE_URL" ]; then
              echo "ERRO: DATABASE_URL ausente apos carregar .env" >&2
              exit 1
            fi
            # Registra no RDS (is_active=true) e desativa as anteriores.
            venv/bin/python - "$V" "$C" "$SIZE" "$SHA" <<'PYEOF'
            import asyncio, os, sys
            version_name, code, size, sha = sys.argv[1:5]
            async def main():
                import asyncpg
                p = await asyncpg.connect(os.environ['DATABASE_URL'], ssl='require')
                await p.execute('UPDATE app_releases SET is_active = FALSE')
                changelog = 'Release v' + version_name + ' (build ' + code + ') entregue pelo CI.'
                await p.execute(
                    "INSERT INTO app_releases (version_name, version_code, release_type,"
                    " filename, file_size_bytes, sha256_hash, changelog, min_android_sdk, is_active)"
                    " VALUES ($1, $2, 'release', 'BragaSaude.apk', $3, $4, $5, 26, TRUE)"
                    " ON CONFLICT (version_code) DO UPDATE SET is_active = TRUE,"
                    " file_size_bytes = EXCLUDED.file_size_bytes, sha256_hash = EXCLUDED.sha256_hash,"
                    " changelog = EXCLUDED.changelog",
                    'v' + version_name, int(code), int(size), sha, changelog)
                await p.close()
            asyncio.run(main())
            PYEOF
            echo "RELEASE REGISTRADA NO RDS"
            # Retencao D52 imediata: mantem so os 3 APKs mais recentes.
            venv/bin/python - <<'PYEOF'
            import asyncio, os, sys
            sys.path.insert(0, '/home/ec2-user/braga-gateway/scripts/server')
            async def main():
                import asyncpg
                from release_retention import purge_old_releases
                pool = await asyncpg.create_pool(os.environ['DATABASE_URL'], min_size=1, max_size=2)
                res = await purge_old_releases(pool, '/home/ec2-user/braga-gateway/releases', keep=3)
                print('[RETENTION]', res)
                await pool.close()
            asyncio.run(main())
            PYEOF
            # doc 10 §1B: dispara o push de "nova versão" para todos os aparelhos
            # registrados. Roda no próprio host da EC2 (127.0.0.1), então o endpoint
            # aceita a chamada sem token. Falha AQUI não pode falhar a release — o
            # APK já está servido e registrado.
            NOTIFY_RESP=$(curl -sS -m 20 -X POST http://127.0.0.1:8080/api/app/notify-update \
              -H "Content-Type: application/json" \
              -d "{\"version_name\":\"v$V\",\"version_code\":$C,\"download_url\":\"https://api.bragasaude.online/api/app/download\"}" 2>&1) || true
            echo "NOTIFY UPDATE: $NOTIFY_RESP"
            echo "DEPLOY OTA CONCLUIDO"
