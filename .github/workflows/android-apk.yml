# =============================================================================
# Braga Saúde — Compilação do APK na nuvem (GitHub Actions)
# Ver documentação completa em:
#   Contexto/08_RELEASE_E_DISTRIBUICAO/03_CI_GITHUB_ACTIONS_BUILD_NA_NUVEM.md
#
# Duas "pistas" a partir de um único workflow (disparo manual):
#   1. build-teste       -> só compila + salva artifact (NÃO é release)
#   2. lancar-release    -> publica GitHub Release (e pronto p/ gateway)
#
# O APK de teste desce no seu PC com GitHub CLI:
#   gh run download <run-id> -n braga-release-apk
# e instala no celular com:
#   adb install -r app-release.apk        (USB ou adb tcpip 5555)
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64     .jks em base64 (uma linha)
#   KEYSTORE_STORE_PASSWORD     senha do keystore
#   KEYSTORE_KEY_ALIAS          alias da chave  (padrão: bragasaude_key)
#   KEYSTORE_KEY_PASSWORD       senha da chave
# Entrega no gateway via AWS SSM (a porta 22 está fechada para a rede;
# scp/ssh davam i/o timeout — run 36630084026):
#   AWS_ACCESS_KEY_ID           IAM gha-bragasaude-android-ssm (mínimo SSM)
#   AWS_SECRET_ACCESS_KEY       secret da mesma chave
#   ADMIN_API_TOKEN             Bearer do broadcast OTA (/api/app/notify-update)
# =============================================================================

name: Build APK

on:
  # Push no master ou em branches de trabalho: só build de teste (nunca release).
  push:
    branches: [ master, 'fix/**', 'feat/**', 'fase-**' ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'releases/**'
  # Disparo manual com escolha do destino.
  workflow_dispatch:
    inputs:
      destino:
        description: "O que fazer com o APK depois de compilar?"
        type: choice
        default: build-teste
        options:
          - build-teste
          - lancar-release
      variante:
        description: "Variante do APK (debug desativa bloqueio de dev para testes)"
        type: choice
        default: debug
        options:
          - debug
          - release
      run_id_testada:
        description: "(só para lancar-release) ID da run testada, para promover o MESMO APK. Deixe vazio para usar a run atual."
        required: false
        default: ''

# O release cria tag/GitHub Release (contents:write) e a pista de promoção
# baixa artifact de outra run (actions:read).
permissions:
  contents: write
  actions: read

# Evita duas builds iguais correndo em paralelo (desperdício de minutos).
concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — BUILD: sempre roda. Compila o APK de release assinado e salva
  # como artifact (descartável, não é release, some em 30 dias).
  # ---------------------------------------------------------------------------
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21 = JVM mínima do AGP 9. O Gradle pode precisar do JDK 25
      # (pinado em gradle/gradle-daemon-jvm.properties); se precisar, ele
      # acha nas instalações da runner via org.gradle.java.installations.paths.
      - name: JDK 21 e 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Plataforma de compilação (compileSdk 35)
        run: yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # Wrapper unix (./gradlew) NÃO está no repositório — só gradlew.bat.
      # A action oficial provê o Gradle 9.5.0 (mesma versão do wrapper).
      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # Keystore e senhas saem dos secrets e viram arquivos locais do runner.
      # NUNCA vão para o git (estão no .gitignore: *.jks e keystore.properties).
      # Se os secrets ainda não foram cadastrados, a build segue SEM assinatura
      # (app/build.gradle.kts trata o caso) — a primeira run serve de prova.
      - name: Materializar keystore de release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "⚠️ Secret RELEASE_KEYSTORE_BASE64 vazio — APK sai SEM assinatura."
            echo "   Cadastre os 4 secrets da keystore (ver doc 03) para assinar."
            exit 0
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_ALIAS" "$KEYSTORE_KEY_PASSWORD" \
            > keystore.properties
          echo "✅ Keystore materializada ($(wc -c < release-keystore.jks) bytes)"

      # --no-daemon evita o download do JDK 25 pinado em
      # gradle/gradle-daemon-jvm.properties; installations.paths dá o caminho
      # das JDKs instaladas pela setup-java caso a criteria seja aplicada.
      - name: Compilar APK
        id: apk
        env:
          INPUT_VARIANTE: ${{ inputs.variante }}
        run: |
          JDK_PATHS=$(ls -d "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/Java_Temurin_jdk"/*/x64 2>/dev/null | paste -sd, -)
          echo "JDKs visíveis ao Gradle: $JDK_PATHS"

          # Merge/push serve para homologação e gera debug por padrão.
          # Release exige workflow_dispatch explícito com lancar-release.
          VARIANTE="$INPUT_VARIANTE"

          if [ -z "$VARIANTE" ] || [ "$VARIANTE" = "debug" ] || [ "$GITHUB_REF_NAME" = "codex/debug-sem-bloqueio-dev" ]; then
            gradle assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace \
              -Dorg.gradle.java.installations.paths="$JDK_PATHS"
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=braga-debug-apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug (bloqueio de modo desenvolvedor desativado)" >> "$GITHUB_OUTPUT"
            echo "retention=7" >> "$GITHUB_OUTPUT"
          else
            gradle assembleRelease --no-daemon --stacktrace \
              -Dorg.gradle.java.installations.paths="$JDK_PATHS"
            # Se gerou unsigned, padroniza o nome para upload sem quebra.
            if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
              UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
              if [ -n "$UNSIGNED_APK" ]; then
                cp "$UNSIGNED_APK" app/build/outputs/apk/release/app-release.apk
                echo "ℹ️ APK não-assinado padronizado para app-release.apk"
              fi
            fi
            echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=braga-release-apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "retention=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar APK e gerar manifesto de origem
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_VARIANT: ${{ steps.apk.outputs.variant }}
        run: |
          python3 .github/scripts/release_manifest.py --apk "$APK_PATH" \
            --variant "${APK_VARIANT%% *}" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --output release-manifest.json

      - name: Salvar manifesto junto à run do APK
        uses: actions/upload-artifact@v4
        with:
          name: braga-release-manifest
          path: release-manifest.json
          retention-days: ${{ steps.apk.outputs.retention }}
          if-no-files-found: error

      - name: Salvar APK como artifact (descartável)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: ${{ steps.apk.outputs.retention }}
          if-no-files-found: error

      - name: Salvar APK dos testes instrumentados
        if: steps.apk.outputs.artifact == 'braga-debug-apk'
        uses: actions/upload-artifact@v4
        with:
          name: braga-debug-androidTest-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
          if-no-files-found: error

      - name: Resumo da build
        run: |
          {
            echo "### :white_check_mark: APK compilado na nuvem"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Destino | \`${{ github.event.inputs.destino || 'build-teste (push)' }}\` |"
            echo "| Variante | \`${{ steps.apk.outputs.variant }}\` |"
            echo "| Artifact | \`${{ steps.apk.outputs.artifact }}\` |"
            echo
            echo "> :bulb: Baixe no PC: \`gh run download ${GITHUB_RUN_ID} -n ${{ steps.apk.outputs.artifact }}\`"
            echo "> :iphone: Instale no celular: \`adb install -r $(basename ${{ steps.apk.outputs.path }})\`"
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "master" ]; then
              echo "> :rocket: Push na master: se \`versionName/versionCode\` for novo, o job de release publica e entrega no gateway."
            else
              echo "> :warning: Artifact NÃO é release — nada foi publicado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # JOB 2 — TESTES UNITÁRIOS: roda em paralelo. Se quebra, NÃO bloqueia o
  # artifact (job independente). É o relatório de saúde do código.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 e 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Plataforma de compilação (compileSdk 35)
        run: yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # AUD-AN02 — gate anti-regressão de emojis em strings de UI.
      # O item quitou e REGREDIU 2x (limpeza por commit seguida de reinserção).
      # Agora quebra o CI se alguém voltar a colocar emoji numa string de UI.
      # Python puro, sem dependências — vem com o ubuntu-latest.
      - name: Gate AUD-AN02 (emojis em strings de UI)
        run: python3 .github/scripts/check_emojis_ui.py

      - name: Validar padrão compartilhado de janelas
        run: python3 .github/scripts/check_modal_consistency.py

      - name: Rodar testes unitários
        run: |
          JDK_PATHS=$(ls -d "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/Java_Temurin_jdk"/*/x64 2>/dev/null | paste -sd, -)
          gradle testDebugUnitTest --no-daemon \
            -Dorg.gradle.java.installations.paths="$JDK_PATHS"

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-unitarios
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Publicar capturas da alimentação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisao-visual-alimentacao
          path: app/build/outputs/nutrition-review/
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar capturas do apoio e perfil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisao-visual-tabagismo
          path: app/build/outputs/smoking-review/
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar schemas Room gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ github.sha }}
          path: app/schemas/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # JOB 3 — VERSÃO NOVA: no push da master o release publica sozinho, então
  # precisa de um guarda. Só vale publicar se versionName/versionCode ainda não
  # viraram release — sem isso todo push recriaria a tag, reenviaria o OTA e
  # reentregaria o mesmo APK para os mesmos usuários.
  # ---------------------------------------------------------------------------
  versao_nova:
    name: Detectar versão nova
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.check.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - name: Comparar com as releases publicadas
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)
          CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts | head -n 1)
          TAG="v${NAME}-build${CODE}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release já publicada::$TAG já existe — nada a publicar neste push."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Versão nova::$TAG ainda não existe — será publicada."
          fi

  # ---------------------------------------------------------------------------
  # JOB 4 — RELEASE: roda sozinho no push da master quando a versão é nova, ou
  # quando você dispara "lancar-release" (promotion de uma run testada).
  # PRINCÍPIO CHAVE: promove o APK que você JÁ TESTOU (mesmos bytes), não
  # recompila. Se veio de outra run, passe o run_id_testada.
  # ---------------------------------------------------------------------------
  release:
    name: Publicar GitHub Release
    needs: [build, unit-tests, versao_nova, release-policy]
    if: |
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.destino == 'lancar-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK para inspeção do APK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ferramentas Android de verificação
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'

      # run_id_testada vazio = promove a build desta própria run.
      - name: Baixar APK (da run testada ou da atual)
        uses: actions/download-artifact@v4
        with:
          name: braga-release-apk
          run-id: ${{ inputs.run_id_testada || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar manifesto da mesma run
        uses: actions/download-artifact@v4
        with:
          name: braga-release-manifest
          run-id: ${{ inputs.run_id_testada || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar origem, testes, assinatura e metadados reais do APK
        id: versao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.run_id_testada || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > origin.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100&filter=latest" > jobs.json
          python3 .github/scripts/release_manifest.py --apk app-release.apk \
            --validate-manifest release-manifest.json --origin origin.json --jobs jobs.json \
            --output verified-release.json
          SOURCE_SHA=$(python3 -c "import json;print(json.load(open('verified-release.json'))['source_sha'])")
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          python3 .github/scripts/check_release_tag.py release-manifest.json "$GITHUB_REPOSITORY"

      - name: Credenciais AWS (entrega via SSM)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Confirmar contrato privado do gateway antes de publicar
        run: python3 .github/scripts/ssm_release.py

      - name: Criar GitHub Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.version_name }}-build${{ steps.versao.outputs.version_code }}
          name: BragaSaude v${{ steps.versao.outputs.version_name }} (build ${{ steps.versao.outputs.version_code }})
          files: |
            app-release.apk
            release-manifest.json
          generate_release_notes: true
          prerelease: false
          body: |
            ## 📦 Release oficial — BragaSaude v${{ steps.versao.outputs.version_name }}

            APK verificado, produzido na run #${{ steps.versao.outputs.run_id }}, commit ${{ steps.versao.outputs.source_sha }}. SHA256: ${{ steps.versao.outputs.sha256 }}.

            > ⚠️ Assinatura nova (D46): usuários da v1.1.2 precisam **desinstalar e reinstalar**.
            > Comunique o backup dos dados locais antes (LGPD).

      - name: Publicar arquivo imutável e catálogo transacional no gateway
        run: python3 .github/scripts/ssm_release.py --manifest verified-release.json

  release-policy:
    uses: ./.github/workflows/release-policy.yml
