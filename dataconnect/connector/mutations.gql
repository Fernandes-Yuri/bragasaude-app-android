# Mutations do Braga Saúde

mutation UpsertProfile(
  $id: String!
  $fullName: String!
  $birthDate: Date
  $gender: String
  $height: Float
  $weight: Float
  $isSmoker: Boolean
  $hasDiabetes: Boolean
  $hasHypertension: Boolean
  $hasThyroidIssue: Boolean
  $hasRenalIssue: Boolean
  $hasBoneIssue: Boolean
  $hasMuscularIssue: Boolean
  $hydrationTargetMl: Int
  $dailyCalorieTarget: Int
  $stepGoal: Int
  $weightGoal: Float
  $sleepStartTime: String
  $sleepEndTime: String
  $emergencyContactName: String
  $emergencyContactRelation: String
  $emergencyContactPhone: String
  $consentAcceptedAt: Timestamp
  $notificationsEnabled: Boolean
  $locationEnabled: Boolean
  $showInFeed: Boolean
  $userRole: String
  $caregiverMode: String
  $avatarIdentifier: String
) @auth(expr: "auth.uid == id") {
  profile_upsert(
    data: {
      id: $id
      fullName: $fullName
      birthDate: $birthDate
      gender: $gender
      height: $height
      weight: $weight
      isSmoker: $isSmoker
      hasDiabetes: $hasDiabetes
      hasHypertension: $hasHypertension
      hasThyroidIssue: $hasThyroidIssue
      hasRenalIssue: $hasRenalIssue
      hasBoneIssue: $hasBoneIssue
      hasMuscularIssue: $hasMuscularIssue
      hydrationTargetMl: $hydrationTargetMl
      dailyCalorieTarget: $dailyCalorieTarget
      stepGoal: $stepGoal
      weightGoal: $weightGoal
      sleepStartTime: $sleepStartTime
      sleepEndTime: $sleepEndTime
      emergencyContactName: $emergencyContactName
      emergencyContactRelation: $emergencyContactRelation
      emergencyContactPhone: $emergencyContactPhone
      consentAcceptedAt: $consentAcceptedAt
      notificationsEnabled: $notificationsEnabled
      locationEnabled: $locationEnabled
      showInFeed: $showInFeed
      userRole: $userRole
      caregiverMode: $caregiverMode
      avatarIdentifier: $avatarIdentifier
    }
  )
}

mutation CreateVitalSign(
  $userId: String!
  $systolicPressure: Int
  $diastolicPressure: Int
  $heartRate: Int
  $glucoseLevel: Int
  $glucoseType: String
  $hydrationMl: Int
  $measuredAt: Timestamp!
) @auth(expr: "auth.uid == userId") {
  vitalSign_insert(
    data: {
      user: { id: $userId }
      systolicPressure: $systolicPressure
      diastolicPressure: $diastolicPressure
      heartRate: $heartRate
      glucoseLevel: $glucoseLevel
      glucoseType: $glucoseType
      hydrationMl: $hydrationMl
      measuredAt: $measuredAt
    }
  )
}

mutation CreateMedication(
  $userId: String!
  $name: String!
  $dosageMg: Float
