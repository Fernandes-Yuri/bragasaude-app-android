# -------------------------------------------------------------
# MUTATIONS — EXAM ITEMS (sincronização Data Connect)
# -------------------------------------------------------------

mutation CreateExamItem(
  $examId: UUID!
  $userId: String!
  $itemKey: String!
  $itemName: String!
  $valueNumeric: Float
  $valueText: String
  $unit: String
  $referenceText: String
  $status: String
  $measuredAt: Timestamp
) @auth(expr: "auth.uid == userId") {
  examItem_insert(
    data: {
      exam: { id: $examId }
      user: { id: $userId }
      itemKey: $itemKey
      itemName: $itemName
      valueNumeric: $valueNumeric
      valueText: $valueText
      unit: $unit
      referenceText: $referenceText
      status: $status
      measuredAt: $measuredAt
    }
  )
}

mutation UpdateExamItem(
  $id: UUID!
  $userId: String!
  $status: String!
) @auth(expr: "auth.uid == userId") {
  examItem_updateMany(
    where: {
      id: { eq: $id }
      user: { id: { eq: $userId } }
    }
    data: {
      status: $status
    }
  )
}

mutation UpsertExamItem(
  $id: UUID
  $examId: UUID!
  $userId: String!
  $itemKey: String!
  $itemName: String!
  $valueNumeric: Float
  $valueText: String
  $unit: String
  $referenceText: String
  $status: String
  $measuredAt: Timestamp
) @auth(expr: "auth.uid == userId") {
  examItem_upsert(
    data: {
      id: $id
      exam: { id: $examId }
      user: { id: $userId }
      itemKey: $itemKey
      itemName: $itemName
      valueNumeric: $valueNumeric
      valueText: $valueText
      unit: $unit
      referenceText: $referenceText
      status: $status
      measuredAt: $measuredAt
    }
  )
}

